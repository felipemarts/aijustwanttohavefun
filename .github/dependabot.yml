version: 2
updates:
  # pnpm workspaces are covered by the npm ecosystem (it reads pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # Also bumps the commit SHAs actions are pinned to, and the version comments next to them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # The Node base image of the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
