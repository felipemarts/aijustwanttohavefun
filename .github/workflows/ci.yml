name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ajwf
          POSTGRES_PASSWORD: ajwf
          POSTGRES_DB: ajwf
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ajwf" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://ajwf:ajwf@localhost:5432/ajwf
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm content:check
      - run: pnpm i18n:report
      - run: pnpm test
      - run: pnpm --filter @ajwf/web build
      - name: Reduced benchmark (fails on >20% regression)
        run: pnpm bench --ci

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
