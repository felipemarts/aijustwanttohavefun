name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repository. Third-party actions are pinned to full commit SHAs (version in
# the comment); Dependabot keeps both the pins and the comments current.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ajwf
          POSTGRES_PASSWORD: ajwf
          # The store tests wipe their database and refuse one whose name does not say "test".
          POSTGRES_DB: ajwf_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ajwf" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # The Postgres-backed store tests run against the service container (they are skipped without it).
      TEST_DATABASE_URL: postgres://ajwf:ajwf@localhost:5432/ajwf_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The benchmark measures the base commit too.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm content:check
      - run: pnpm i18n:report
      - run: pnpm test
      - run: pnpm --filter @ajwf/web build
      - name: Reduced benchmark (fails on >20% regression)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        # Timings are compared with the base commit measured on this same runner (CI machines vary too much for a
        # committed number); without a usable base, with the committed baseline (sizes always, timings when the
        # baseline came from the same platform).
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:tools/bench/src/ci.ts" 2>/dev/null \
             && git grep -q -- "--baseline" "$BASE_SHA" -- tools/bench/src/main.ts; then
            git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
            (cd "$RUNNER_TEMP/base" && pnpm install --frozen-lockfile --prefer-offline \
              && pnpm bench --ci --update-baseline --baseline "$RUNNER_TEMP/base-baseline.json")
            pnpm bench --ci --baseline "$RUNNER_TEMP/base-baseline.json"
          else
            pnpm bench --ci
          fi

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ajwf
          POSTGRES_PASSWORD: ajwf
          POSTGRES_DB: ajwf
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ajwf" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the production image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ajwf:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (read-only root, /healthz, graceful stop)
        run: |
          docker run -d --name ajwf --network host --read-only --tmpfs /tmp \
            -e DATABASE_URL=postgres://ajwf:ajwf@localhost:5432/ajwf -e PUBLIC_URL=http://localhost:8710 \
            -e NODE_ENV=development -e LOG_LEVEL=info ajwf:ci
          for i in $(seq 1 60); do curl -fsS http://localhost:8710/healthz && break; sleep 1; done
          curl -fsS http://localhost:8710/api/v1/help > /dev/null
          curl -fsS -H 'accept: text/html' http://localhost:8710/ | grep -q '<div id="root">'
          docker stop -t 60 ajwf
          docker logs ajwf 2>&1 | tail -5
          test "$(docker inspect ajwf --format '{{.State.ExitCode}}')" = 0

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks itself rather than gitleaks-action: the action scans only the pushed or PR range with
      # `--first-parent --no-merges`, so commits arriving through a merge are never scanned. This scans every commit
      # reachable from the checked-out ref, with a release binary verified against its published SHA-256.
      - name: Scan the whole history for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c # linux_x64
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .

  # ── Deployment: pushes to main only, after every job above ───────────────────────────────────────────────────────
  # This repository is public, so (docs/DEPLOY.md section 14):
  # - both jobs run only where the DEPLOY_ENABLED variable is "true": a fork skips them;
  # - the host's address and key are secrets of the `production` environment, which accepts runs from main only: a
  #   pull request, even one that edits this file, never sees them;
  # - nothing from the repository is copied to the host or run on it. The key can ask for one thing: "run the image
  #   that main just published". How that image runs (user, sandbox, network, secrets) is the host's own file.

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [check, docker, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the GitHub container registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the production image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # One moving tag: the host runs the image by digest and checks that it is what this tag points at.
          tags: ghcr.io/${{ github.repository }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Written by the `docker` job of this same run.
          cache-from: type=gha

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://aijustwanttohavefun.com
    permissions:
      packages: read
    steps:
      # No checkout and no action: the job that holds the key runs these lines and nothing else.
      - name: Ask the host to run the published image
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          # Lives as long as this job: the host pulls the image with it.
          REGISTRY_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          case "$DIGEST" in sha256:*) ;; *) echo "the publish job gave no image digest" >&2; exit 1 ;; esac
          umask 077
          dir="$RUNNER_TEMP/deploy"
          mkdir -p "$dir"
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$dir/known_hosts"
          # The host ignores any command: it reads these two lines, and answers with one line per step.
          printf '%s\n%s\n' "$DIGEST" "$REGISTRY_TOKEN" | ssh -T -i "$dir/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" -o LogLevel=ERROR \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$DEPLOY_USER@$DEPLOY_HOST"
