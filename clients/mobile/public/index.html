<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- Defence in depth for the desktop build: scripts and API calls stay on this origin (the session token can only
         travel to the program that served the page); sprites may come from the game server. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark" />
    <title>AI Just Want to Have Fun</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background: #14111d;
        color: #f1e6cf;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>JavaScript is required.</noscript>
    <div id="root"></div>
  </body>
</html>
