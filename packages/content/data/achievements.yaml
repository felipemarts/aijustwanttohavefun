# Achievements are conditions over per-agent stat counters: unlocked when `stat >= gte`.
# The engine bumps the counters with `bump` / `statMax` (packages/engine/src/agent.ts).
# `world_first`: only the first agent on the server to reach it gets it. `title`: unlocks a title.

