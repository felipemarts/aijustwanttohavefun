# NPC shops. Fixed prices: they are the ceiling (sells) and the floor (buy_rate x item value) of the player market.
- id: general_store
  buy_rate: 0.4
  buys: [weapon, armor, trinket, consumable, food, material, cosmetic, tool, bag, dye]
  sells:
    - { item: bread, price: 8 }
    - { item: minor_potion, price: 25 }
    - { item: cloth_armor, price: 16 }
    - { item: rusty_sword, price: 20 }
    - { item: apprentice_staff, price: 20 }
    - { item: worn_dagger, price: 20 }
    - { item: wooden_mace, price: 20 }
