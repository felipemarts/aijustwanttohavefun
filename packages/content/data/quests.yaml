# Quests are data. Step types: kill, collect, deliver, visit, escort, craft, gather, party, trade, mentor,
# contribute, vote, talk, say, friend, equip, board_post, journal, shop_buy, level, help_newbie, puzzle, boss,
# profession, market, rest, emote, guild, duel.
# - A step without `target` accepts anything of that type.
# - `party_min`: progress only counts while in a party with at least that many members in the same room.
# - `consume`: items removed from the inventory on turn-in (collect and deliver quests).
# - kind tutorial: the 20-quest trail, each one `requires` the previous. kind daily: 3 offered per day, 1 social.
# - kind chain: two-step group chains. kind escort: protect a slow NPC with a party.

