# Village projects. Nobody can afford one alone. `requires` forms the project tree; progress never goes back.
# `unlocks` are flags the engine reads (see packages/engine/src/balance.ts).
- id: bridge
  site: village.river_bank
  building: bridge
  cost: { gold: 500, items: [{ item: wood, qty: 60 }, { item: stone, qty: 40 }, { item: iron_ingot, qty: 10 }] }
  unlocks: [mines_shortcut]
- id: watchtower
  site: village.plot_ne
  building: watchtower
  cost: { gold: 800, items: [{ item: wood, qty: 80 }, { item: stone, qty: 80 }] }
  unlocks: [world_boss_warning]
- id: inn_expansion
  site: village.tavern
  building: inn
  cost: { gold: 600, items: [{ item: wood, qty: 60 }, { item: linen, qty: 20 }, { item: pot, qty: 4 }] }
  unlocks: [tavern_camaraderie]
- id: library
  site: village.plot_nw
  building: library
  requires: [watchtower]
  cost: { gold: 1500, items: [{ item: wood, qty: 100 }, { item: stone, qty: 60 }, { item: crystal, qty: 10 }, { item: ancient_relic, qty: 4 }] }
  unlocks: [mage_library]
- id: covered_market
  site: village.market
  building: covered_market
  requires: [inn_expansion]
  cost: { gold: 1500, items: [{ item: wood, qty: 120 }, { item: linen, qty: 40 }, { item: buckle, qty: 20 }] }
  unlocks: [market_slots]
- id: arena
  site: village.plot_sw
  building: arena
  requires: [bridge]
  cost: { gold: 2000, items: [{ item: stone, qty: 150 }, { item: iron_ingot, qty: 30 }, { item: wood, qty: 60 }] }
  unlocks: [arena_duels]
- id: wall
  site: village.south_gate
  building: wall
  requires: [arena, watchtower]
  cost: { gold: 4000, items: [{ item: stone, qty: 300 }, { item: iron_ingot, qty: 50 }] }
  unlocks: [sieges]
- id: statue
  site: village.square
  building: statue
  requires: [bridge, watchtower, inn_expansion]
  cost: { gold: 3000, items: [{ item: stone, qty: 100 }, { item: silver_ore, qty: 20 }, { item: crystal, qty: 10 }] }
  unlocks: [statue_honor]
