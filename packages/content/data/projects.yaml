# Village projects. Nobody can afford one alone. `requires` forms the project tree; progress never goes back.
# `unlocks` are flags the engine reads (see packages/engine/src/balance.ts).
- id: bridge
  site: village.river_bank
  building: bridge
  cost: { gold: 6000, items: [{ item: wood, qty: 720 }, { item: stone, qty: 480 }, { item: iron_ingot, qty: 120 }] }
  unlocks: [mines_shortcut]
- id: watchtower
  site: village.plot_ne
  building: watchtower
  cost: { gold: 9600, items: [{ item: wood, qty: 960 }, { item: stone, qty: 960 }] }
  unlocks: [world_boss_warning]
- id: inn_expansion
  site: village.tavern
  building: inn
  cost: { gold: 7200, items: [{ item: wood, qty: 720 }, { item: linen, qty: 240 }, { item: pot, qty: 48 }] }
  unlocks: [tavern_camaraderie]
- id: library
  site: village.plot_nw
  building: library
  requires: [watchtower]
  cost: { gold: 30000, items: [{ item: wood, qty: 2000 }, { item: stone, qty: 1200 }, { item: crystal, qty: 200 }, { item: ancient_relic, qty: 80 }] }
  unlocks: [mage_library]
- id: covered_market
  site: village.market
  building: covered_market
  requires: [inn_expansion]
  cost: { gold: 30000, items: [{ item: wood, qty: 2400 }, { item: linen, qty: 800 }, { item: buckle, qty: 400 }] }
  unlocks: [market_slots]
- id: arena
  site: village.plot_sw
  building: arena
  requires: [bridge]
  cost: { gold: 40000, items: [{ item: stone, qty: 3000 }, { item: iron_ingot, qty: 600 }, { item: wood, qty: 1200 }] }
  unlocks: [arena_duels]
- id: wall
  site: village.south_gate
  building: wall
  requires: [arena, watchtower]
  cost: { gold: 120000, items: [{ item: stone, qty: 9000 }, { item: iron_ingot, qty: 1500 }] }
  unlocks: [sieges]
- id: statue
  site: village.square
  building: statue
  requires: [bridge, watchtower, inn_expansion]
  cost: { gold: 60000, items: [{ item: stone, qty: 2000 }, { item: silver_ore, qty: 400 }, { item: crystal, qty: 200 }] }
  unlocks: [statue_honor]
