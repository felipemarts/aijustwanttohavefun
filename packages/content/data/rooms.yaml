# The world is a graph of rooms. `rect` is [x, y, w, h] in 16px tiles on the global map (rendering only).
# Grid convention used here: a room in cell (cx, cy) has rect [cx*12, cy*10, 10, 8].
# gates: exits that need a completed project, a solved puzzle, a party, or a dead boss.

