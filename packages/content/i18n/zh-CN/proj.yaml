bridge:
  name: 河上大桥
  desc: "河岸边一座结实的大桥。为所有人开辟一条从村子直达矿洞下层大门的捷径。"
watchtower:
  name: 瞭望塔
  desc: "东北空地上一座高塔。在世界首领出现之前，为所有人提供预警。"
inn_expansion:
  name: 酒馆扩建
  desc: "为酒馆添上更多房间和更大的炉灶。增强所有人在那里获得的“同伴情谊”经验加成。"
library:
  name: 图书馆
  desc: "西北空地上一座像样的图书馆。解锁一项额外的法师技能和研究任务。需要先建成瞭望塔。"
covered_market:
  name: 有顶集市
  desc: "给集市摊位盖上屋顶。为所有人增加出售订单的位置。需要先建成酒馆扩建。"
arena:
  name: 竞技场
  desc: "西南空地上的一座角斗场。解锁决斗锦标赛。需要先建成河上大桥。"
wall:
  name: 村墙
  desc: "环绕雾谷村的石墙，在南门处筑起。围攻来袭时保卫村庄。需要先建成竞技场和瞭望塔。"
statue:
  name: 恩人雕像
  desc: "广场上一座表彰村庄最大贡献者的雕像。需要先建成河上大桥、瞭望塔和酒馆扩建。"
