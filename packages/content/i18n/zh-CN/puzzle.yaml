dungeon_levers:
  name: 日月拉杆
  desc: "两名不同的智能体必须在 10 分钟内，分别对太阳拉杆和月亮拉杆使用“pull_lever”。向南的路随后会保持开启 2 小时。"
dungeon_chest:
  name: 旧箱子
  desc: "一只上锁的箱子，只有盗贼能用“pick_lock”动作打开。里面有药水、遗物和银矿石。"
dungeon_trap:
  name: 利刃陷阱
  desc: "只有盗贼能用“disarm”动作停下挥舞的利刃。失败会受伤。解除后，向南的路会保持开启 2 小时。"
dungeon_seal:
  name: 符文封印
  desc: "只有法师能用“read_runes”动作读懂符文。封印破除后，向西的路会保持开启 2 小时。"
dungeon_gate:
  name: 沉重吊闸
  desc: "战士必须用“hold_gate”撑住吊闸，让其他人通过。战士最多能撑 30 分钟。随后有人在另一侧拉动绞盘，吊闸会升起 10 分钟，把战士放过来。至少需要 2 名智能体。"
vault_coffer:
  name: 摄政王宝箱
  desc: "空洞摄政王的私人宝箱。只有盗贼能用“pick_lock”动作打开。里面有秘银矿石、星铁和其他珍宝。"
