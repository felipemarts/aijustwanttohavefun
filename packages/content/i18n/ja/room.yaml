# Village of Mistvale
village.square:
  name: ミストヴェイル広場
  desc: "石畳が敷かれたミストヴェイルの中心。掲示板とOlgaの雑貨屋があります。北に酒場、南に役場、東に市場、西に神殿があります。"
village.tavern:
  name: まどろみグリフォン亭
  desc: "Bertaが切り盛りする、暖かくてにぎやかな酒場の広間。掲示板、料理人用の厨房、休みたい人のためのベッドがあります。"
village.guild_hall:
  name: ギルド会館
  desc: "旗と書類だらけの会館。登記官Veyが、手数料と引き換えに新しいギルドの設立を認可しています。"
village.plot_nw:
  name: 北西の空き地
  desc: "希望の杭が1本立っているだけの空き地。ここに村の図書館が建つ予定です。"
village.plot_ne:
  name: 北東の空き地
  desc: "特に何も見えない景色が自慢の草地。ここに物見の塔が建つ予定です。"
village.plot_far:
  name: 東端の空き地
  desc: "村はずれの空き地。ゴールドと野心を持った誰かを待っています。"
village.temple:
  name: ミストヴェイル神殿
  desc: "シスターIlseが守る静かな神殿。倒れた者はここで目を覚まします。財布は少し軽くなっていますが。"
village.west_gate:
  name: 西門
  desc: "木々に面した木造の門。西にはささやきの森が広がり、南には錬金術店があります。"
village.alchemist:
  name: 錬金術店
  desc: "Mirelaの店は、薬草とほのかな危険のにおいがします。隅では錬金台がぐつぐつ煮えていて、錬金術師が使えます。"
village.tailor:
  name: 仕立て屋
  desc: "布の反物、仕立て屋用のきしむ織機、そしてあなたの服装をこっそり品定めしているTomasがいます。"
village.town_hall:
  name: 役場
  desc: "書記官Aldoがここでプロジェクト台帳と投票箱を管理しています。村のプロジェクトへの寄付、投票、村長選への立候補はこちらで。"
village.smithy:
  name: 鍛冶場
  desc: "Gunnarの炉は昼も夜も唸っています。鍛冶屋はここで製作でき、店では金物を売っています。"
village.market:
  name: 市場
  desc: "エージェントが売り注文を出す露店が並びます。村長が課税しています。商人Bramが荷車のそばでそわそわしています。"
village.east_gate:
  name: 東門
  desc: "古い街道に面した、衛兵のいる門。東には古都ケイルの廃墟があり、法はあなたについてきません。"
village.plot_se:
  name: 南東の空き地
  desc: "鍛冶場の裏にある静かな空き地。炉の熱でほんのり暖かく、可能性に満ちています。"
village.plot_sw:
  name: 南西の空き地
  desc: "踏み固められた草の、広くて平らな空き地。ここに闘技場が建つ予定です。"
village.training_yard:
  name: 訓練場
  desc: "わら人形と怒鳴り声のアドバイス。軍曹Holtが新兵をしごいており、友好的な決闘も認められています。"
village.south_gate:
  name: 南門
  desc: "湿地を見下ろす、衛兵のいる門。南には無法の暗泥の沼地が広がります。ここに村の外壁が建つ予定です。"
village.plot_s:
  name: 南の空き地
  desc: "鍛冶場と南門のあいだの空き地。土は良いのに、まだ何も建っていません。"
village.north_road:
  name: 北の街道
  desc: "村から延びる轍だらけの道。東は川岸、西は灰背丘陵へ続く小道です。"
village.river_bank:
  name: 川岸
  desc: "流れの速い川。流木を拾えます。橋が完成すれば、すぐ北の対岸が鉱山です。"

# Whisperwood Forest
forest.edge:
  name: 森の入り口
  desc: "日の差す木立。レンジャーFenが見張っています。スライムがぷるぷる跳ね、木材と緑の薬草が簡単に集まります。"
forest.path:
  name: 森の小道
  desc: "ささやく葉の下を曲がりくねる小道。スライムと狼がうろつき、木材がたっぷりあります。"
forest.glade:
  name: 月明かりの空き地
  desc: "緑の薬草が豊富で、月の薬草も少し生えている開けた場所。狼が狩りをし、夜は影狼も加わります。"
forest.thicket:
  name: 蜘蛛の茂み
  desc: "蜘蛛の巣が張りめぐらされた深い茨の茂み。木材に向いた木々のあいだに大蜘蛛が潜んでいます。"
forest.old_oak:
  name: 古い樫の木
  desc: "4本の小道が交わる場所にそびえる巨大な古木。猪が根元を掘り返し、落ちた枝は良い木材になります。"
forest.hollow:
  name: 奥の窪地
  desc: "薄暗い行き止まり。トレントの苗木がきしみ、月の薬草が密に茂ります。夜には影狼がうろつきます。"
forest.creek:
  name: せせらぎの小川
  desc: "冷たい小川。岸には緑の薬草、川底にはゆるんだ石があります。スライムや、たまに猪が水を飲みに来ます。"
forest.mushroom_ring:
  name: きのこの輪
  desc: "かすかに唸る、青白いきのこの輪。大蜘蛛とトレントの苗木が月の薬草を守っています。"

# Greyback Hills and the Mines
hills.trail:
  name: 丘の小道
  desc: "村から登っていく石だらけの小道。岩のあいだで猪が草を食み、石材が簡単に集まります。"
hills.switchback:
  name: つづら折り
  desc: "丘を登るジグザグの道。洞窟コウモリとはぐれ狼が登山者を悩ませます。岩肌に石材と少しの銅鉱石が見えます。"
hills.pass:
  name: 灰背の峠
  desc: "コボルドが守る風の強い峠。東に鉱山の入り口があります。"
mines.entrance:
  name: 鉱山の入り口
  desc: "木枠で組まれた鉱山の入り口。親方Brakkaが洞窟コウモリに負けない声で怒鳴っています。銅鉱石と石材がすぐ手に入ります。"
mines.tunnel:
  name: 主坑道
  desc: "古いレールとコボルドだらけの長い坑道。壁には鉄鉱石と銅鉱石が走っています。南に下の門があります。"
mines.lower_gate:
  name: 下の門
  desc: "コボルドが守る鉱山の裏口。鉄鉱石が少しあります。橋が完成すれば、南の川に出られます。"
mines.deep_shaft:
  name: 深い立坑
  desc: "目がくらむ立坑。ロックゴーレムがごりごり歩き回っています。鉄鉱石が豊富で、銀の鉱脈も少しあります。"
mines.flooded_gallery:
  name: 水没した坑道
  desc: "膝まで浸かる黒い水と、滴る水音の反響。洞窟コウモリとロックゴーレムが鉄鉱石を守っています。"
mines.crystal_cavern:
  name: 水晶の洞窟
  desc: "水晶と銀鉱石がきらめく洞窟。水晶甲虫は、ここにあるものすべて自分のものだと思っています。"
mines.forge_ruin:
  name: 廃坑の炉
  desc: "とうの昔に冷えきって、製作には使えない古代の炉。今はコボルドの親方と手下たちが仕切っています。瓦礫の中に鉄鉱石があります。"

# Murkmire Swamp
swamp.marsh_edge:
  name: 湿地のほとり
  desc: "道が泥に沈み、法もここで途切れます。沼ユリのあいだで泥沼ガエルが鳴いています。"
swamp.reeds:
  name: ささやく葦原
  desc: "背の高い葦が沼の潜み手と泥沼ガエルを隠しています。浅瀬には沼ユリと緑の薬草が生えています。"
swamp.bog:
  name: 黒い泥炭地
  desc: "足を吸い込む泥と悪臭。沼の潜み手が泥の下で待ち伏せ、夜には鬼火が漂い、ユリのあいだに影傘が生えます。"
swamp.witch_hut:
  name: 隠者の小屋
  desc: "錬金台のある傾いた小屋。薬草師Morwenの住まいです。意地悪な妹の沼の老魔女が、影傘のあいだに居座っています。"
swamp.sunken_road:
  name: 沈んだ街道
  desc: "沼に半分飲まれた古い石畳の道。沼の潜み手とさまようスケルトンが出没します。東に廃墟があります。"
swamp.drowned_shrine:
  name: 水没した祠
  desc: "鬼火に照らされた沈んだ祠。夜にはレイスが出ます。石の上で影傘と少しの水晶が見つかります。"

# Ruins of Old Cael
ruins.road:
  name: 古都ケイルの街道
  desc: "村の東にある、ひび割れた街道。スケルトンが巡回していて、ここから先は無法地帯です。学者Inesがゆるんだ石のあいだで野営しています。"
ruins.outskirts:
  name: 廃墟の外れ
  desc: "崩れた家々を、スケルトンと山賊が荒らし回っています。瓦礫から古代の遺物が出てくることがあります。"
ruins.collapsed_tower:
  name: 崩れた塔
  desc: "レイスが取りつく倒壊した塔。瓦礫の中でミスリル鉱石がきらめき、古代の遺物も見つかります。"
ruins.plaza:
  name: 壊れた広場
  desc: "かつての都の広場。今は山賊の交差点です。東に隠れ家、南に地下墓所への階段があります。"
ruins.overgrown_street:
  name: 草に埋もれた通り
  desc: "つたと根が通りを取り戻しています。銀鉱石の鉱脈のそばを、スケルトンがとぼとぼ通り過ぎます。"
ruins.drowned_gate:
  name: 水没した門
  desc: "古都の西門。蝶番まで沼の水に沈んでいます。スケルトンと沼の潜み手が、ぎこちなく場所を分け合っています。"
ruins.bandit_hideout:
  name: 山賊の隠れ家
  desc: "戦利品と行儀の悪さであふれる山賊の頭目のねぐら。星鉄が隠してあります。1人では来ないこと。"
ruins.catacomb_stairs:
  name: 地下墓所への階段
  desc: "スケルトンが守る、すり減った階段。地下墓所へ続いています。パーティだけが降りられます。"

# Catacombs of the Hollow Regent
dungeon.antechamber:
  name: 前室
  desc: "太陽のレバーと月のレバーがある冷たい広間。別々の2人のエージェントが1分以内にレバーを引くと、南への道が開きます。"
dungeon.lever_hall:
  name: レバーの間
  desc: "レバーの扉の奥にある、墓所の番兵が見張る広間。古い鍵付きの宝箱が盗賊を待っています。"
dungeon.trapped_corridor:
  name: 罠の回廊
  desc: "刃が揺れる回廊を骨の猟犬が歩き回っています。盗賊が罠を解除すれば、南への道が開きます。"
dungeon.rune_door:
  name: ルーンの扉
  desc: "ルーンが光る封印の扉。墓所の番兵と骨の猟犬が見張りに立っています。魔法使いだけが封印を読み解き、西への道を開けます。"
dungeon.gate_hall:
  name: 門の間
  desc: "巨大な落とし格子の両脇を墓所の番兵が固めています。ほかの者が西へ通るあいだ、戦士が格子を支えなければなりません。"
dungeon.boss_lair:
  name: うつろの摂政の玉座
  desc: "うつろの摂政が塵の玉座から君臨しています。門のそばの巻き上げ機で戦士を中に入れられます。摂政が倒れると、北の宝物庫が開きます。"
dungeon.vault:
  name: 摂政の宝物庫
  desc: "うつろの摂政の私的な財宝庫。ようやく静かになりました。金庫には、盗賊だけが破れる鍵がかかっています。"
