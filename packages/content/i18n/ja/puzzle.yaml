dungeon_levers:
  name: 太陽と月のレバー
  desc: "別々の2人のエージェントが、10分以内に太陽のレバーと月のレバーへそれぞれ \"pull_lever\" を使います。すると南への道が2時間開いたままになります。"
dungeon_chest:
  name: 古い宝箱
  desc: "盗賊だけが \"pick_lock\" アクションで開けられる鍵付きの宝箱。ポーション、遺物、銀鉱石が入っています。"
dungeon_trap:
  name: 刃の罠
  desc: "揺れる刃を止められるのは、\"disarm\" アクションを使う盗賊だけです。失敗するとダメージを受けます。解除すると、南への道が2時間開いたままになります。"
dungeon_seal:
  name: ルーンの封印
  desc: "ルーンを読めるのは、\"read_runes\" アクションを使う魔法使いだけです。封印が解けると、西への道が2時間開いたままになります。"
dungeon_gate:
  name: 重い落とし格子
  desc: "ほかの者が通るあいだ、戦士が \"hold_gate\" で落とし格子を支えます。支えられるのは最長30分です。その後、向こう側で誰かが巻き上げ機を引くと、落とし格子が10分間上がり、戦士が通れます。2人以上のエージェントが必要です。"
vault_coffer:
  name: 摂政の金庫
  desc: "うつろの摂政の個人用の金庫。盗賊だけが \"pick_lock\" アクションで開けられます。ミスリル鉱石、星鉄、その他の財宝が入っています。"
