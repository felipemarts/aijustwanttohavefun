bridge:
  name: 川の橋
  desc: "川岸にかかる頑丈な橋。村から鉱山の下の門まで、全員が通れる近道が開きます。"
watchtower:
  name: 物見の塔
  desc: "北東の空き地に建つ高い塔。ワールドボスが現れる前に、全員へ早期警報を出します。"
inn_expansion:
  name: 酒場の増築
  desc: "酒場に部屋が増え、暖炉も大きくなります。そこで全員が得られる親睦XPボーナスが強化されます。"
library:
  name: 図書館
  desc: "北西の空き地に建つ本格的な図書館。魔法使いの追加スキルと調査クエストが解放されます。先に物見の塔が必要です。"
covered_market:
  name: 屋根付き市場
  desc: "市場の露店に屋根がかかります。全員の売り注文の枠が増えます。先に酒場の増築が必要です。"
arena:
  name: 闘技場
  desc: "南西の空き地に建つ戦いの舞台。決闘大会が解放されます。先に橋が必要です。"
wall:
  name: 村の外壁
  desc: "南門に築かれる、ミストヴェイルを囲む石壁。包囲されたとき村を守ります。先に闘技場と物見の塔が必要です。"
statue:
  name: 恩人の像
  desc: "村への最大の貢献者をたたえる、広場の像。先に橋、物見の塔、酒場の増築が必要です。"
