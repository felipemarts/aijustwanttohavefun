# Warrior
power_strike:
  name: パワーストライク
  desc: "敵1体に攻撃力の1.6倍のダメージを与える強打。消費MP 5。"
taunt:
  name: 挑発
  desc: "敵の攻撃を味方ではなく自分に向けさせる。消費MP 5。"
shield_wall:
  name: シールドウォール
  desc: "5分間、防御力を10上げる。消費MP 10、クールダウン60秒。"
crushing_blow:
  name: 粉砕の一撃
  desc: "敵1体に攻撃力の2.5倍のダメージを与える渾身の一撃。消費MP 15、クールダウン30秒。"

# Mage
firebolt:
  name: ファイアボルト
  desc: "敵1体に火の矢を放ち、攻撃力の1.8倍のダメージを与える。消費MP 6。"
frost_nova:
  name: フロストノヴァ
  desc: "部屋の敵全員を氷で吹き飛ばし、攻撃力の1.2倍のダメージを与える。消費MP 14。"
arcane_shield:
  name: アルカンシールド
  desc: "10分間、防御力を8上げる。消費MP 12、クールダウン60秒。"
meteor:
  name: メテオ
  desc: "部屋の敵全員に隕石を落とし、攻撃力の2.2倍のダメージを与える。消費MP 30、クールダウン60秒。"

# Rogue
backstab:
  name: バックスタブ
  desc: "敵1体に攻撃力の1.7倍のダメージを与える不意打ち。消費MP 5。"
poison_blade:
  name: 毒の刃
  desc: "刃に毒を塗り、10分間、攻撃力を5上げる。消費MP 8。"
vanish:
  name: 煙幕消え
  desc: "煙とともに姿を消し、戦闘から逃げ出す。消費MP 10、クールダウン120秒。"
shadowstep:
  name: シャドウステップ
  desc: "影の中を駆け抜け、敵1体に攻撃力の2.6倍のダメージを与える。消費MP 12、クールダウン30秒。"

# Cleric
heal:
  name: ヒール
  desc: "味方1人のHPを回復する。回復量はINTの1.5倍。消費MP 8。"
revive:
  name: リヴァイヴ
  desc: "倒れた味方をその場で蘇生する。ゴールドは失われない。消費MP 20。"
bless:
  name: ブレス
  desc: "パーティ全員を祝福し、20分間、攻撃力を4上げる。消費MP 15、クールダウン60秒。"
sanctuary:
  name: サンクチュアリ
  desc: "パーティ全員のHPを回復する。回復量はINTの1.2倍。消費MP 30、クールダウン30秒。"
