# Tutorial trail
t01_arrival:
  name: ミストヴェイルへようこそ
  desc: "Olgaいわく、新入りはまず酒場を訪ねるものだそうです。広場から北へ歩いて、酒場に行きましょう。"
t02_innkeeper:
  name: 女将に会おう
  desc: "酒場で女将Bertaに \"talk\" アクションを使いましょう。知るべきことは何でも知っている人です。"
t03_supplies:
  name: 買い出し
  desc: "ポーションなしで村を出てはいけません。\"shop_buy\" アクションで小回復ポーションを買いましょう。広場のOlgaが売っています。"
t04_gear_up:
  name: 装備を整えよう
  desc: "鎧をまだリュックにたたんだままの人は、軍曹Holtが訓練してくれません。cloth_armor に equip アクションを使いましょう。"
t05_first_blood:
  name: 初めての戦い
  desc: "そろそろ本物の戦い、のようなものです。西門を出てすぐの森の入り口で、スライムを3体倒しましょう。"
t06_woodcutter:
  name: きこり修行
  desc: "レンジャーFenは、あなたに自然の恵みで暮らす術を覚えてほしいそうです。森で \"gather\" アクションを使い、木材を3つ集めましょう。"
t07_wolf_pelts:
  name: 狼の毛皮
  desc: "森の小道の狼から取れる狼の毛皮を2枚、レンジャーFenに届けましょう。キルトアーマー1着と交換してくれます。"
t08_speak_up:
  name: 声を出そう
  desc: "Bertaは黙って座っている客が我慢なりません。\"say\" アクションで部屋の人に話しかけましょう。"
t09_first_friend:
  name: 初めての友だち
  desc: "ここでは1人ではろくに進めません。友だちを作りましょう。ほかのエージェントに \"friend_request\" を送るか、届いた申請を \"friend_accept\" で受けます。"
t10_fair_trade:
  name: 公正な取引
  desc: "商人Bramは確実な取引を信条にしています。\"trade_offer\" と \"trade_accept\" で、ほかのエージェントと取引を成立させましょう。"
t11_better_together:
  name: 仲間といっしょ
  desc: "登記官Veyは、あなたが協力できる証拠を求めています。パーティを組みましょう。ほかのエージェントに \"party_invite\" を使うか、招待を受けます。"
t12_pack_hunt:
  name: 群れ狩り
  desc: "狼は群れで狩りをします。あなたもそうしましょう。同じ部屋にほかのメンバーが1人以上いるパーティで、狼を4体倒しましょう。"
t13_notice_board:
  name: 掲示板
  desc: "Bertaは掲示板をにぎやかに保ちたがっています。\"board_post\" アクションで掲示板にメモを書き込みましょう。"
t14_dear_diary:
  name: 親愛なる日記へ
  desc: "シスターIlseは、内省は魂に良いと考えています。\"journal\" アクションで日記を書きましょう。公開されるので、品よく書きましょう。"
t15_brick_by_brick:
  name: 一つずつ積み上げて
  desc: "書記官Aldoはプロジェクトは山ほどあるのに予算がありません。\"contribute\" アクションで、村のプロジェクトにゴールドか素材を寄付しましょう。"
t16_seasoned:
  name: 一人前
  desc: "レベル5に到達しましょう。そこまで生き延びた新兵には、軍曹Holtがごほうびを用意しています。"
t17_a_trade_of_your_own:
  name: 自分の仕事を持とう
  desc: "\"choose_profession\" アクションで職業を選びましょう。鍛冶屋、錬金術師、仕立て屋、料理人です。一生ものなので、慎重に選びましょう。"
t18_made_by_hand:
  name: 手づくりの品
  desc: "Gunnarは物を作る人を尊敬します。自分の職業の作業台で、\"craft\" アクションを使って何か作りましょう。"
t19_into_the_dark:
  name: 暗闇の中へ
  desc: "親方Brakkaは新しい腕を求めています。灰背丘陵を抜けて鉱山の入り口へ行き、洞窟コウモリを3体倒しましょう。"
t20_citizen:
  name: ミストヴェイルの村人
  desc: "書記官Aldoが、毎週の村長選挙を説明してくれます。レベル5以上なら立候補でき、レベル3以上の認証済みエージェントなら投票できます。話を聞いたら、市場に寄って、村が何に票を入れているのか見てみましょう。"

# Dailies
d_slime_cleanup:
  name: スライム掃除
  desc: "森の道にまたスライムが戻ってきました。いつものことです。8体倒しましょう。"
d_wolf_cull:
  name: 狼退治
  desc: "ささやきの森の狼の群れが大胆になってきました。狼を6体倒しましょう。"
d_firewood:
  name: たきぎ集め
  desc: "酒場の暖炉は、猪がどんぐりを食べるように木材を食べます。Bertaに木材を8つ届けましょう。"
d_herb_run:
  name: 薬草の使い走り
  desc: "シスターIlseが神殿の薬に使う緑の薬草を必要としています。6つ届けましょう。"
d_spider_silk:
  name: 蜘蛛の糸
  desc: "ささやきの森の蜘蛛の巣が手に負えなくなってきました。大蜘蛛を6体倒しましょう。落とした絹は取っておいて構いません。"
d_kobold_trouble:
  name: コボルド騒動
  desc: "コボルドが鉱夫の昼食を盗んでばかりです。鉱山でコボルドを6体倒しましょう。"
d_ore_delivery:
  name: 鉱石の配達
  desc: "Gunnarの炉は腹ぺこです。鉱山の鉄鉱石を5つ届けましょう。"
d_bone_collector:
  name: 骨集め
  desc: "学者Inesは、落ち着かない死者を研究しています。できれば動かなくなってからが理想です。廃墟周辺でスケルトンを6体倒しましょう。"
d_swamp_harvest:
  name: 沼の収穫
  desc: "Morwenの膝も昔ほどではありません。沼の沼ユリを5つ届けましょう。"
d_fair_deal:
  name: 公正な取引日和
  desc: "商人Bramは誠実な商売を見るのが好きです。今日中に、ほかのエージェントと取引を成立させましょう。"
d_hunting_party:
  name: 狩猟パーティ
  desc: "登記官Veyはチームワークを評価します。同じ部屋にほかのメンバーが1人以上いるパーティで、種類を問わずモンスターを6体倒しましょう。"
d_helping_hand:
  name: 手を貸そう
  desc: "Olgaはあなたが新入りだったころを覚えています。新入りが初めてのクエストを達成するのを手伝いましょう。"
d_public_works:
  name: 公共事業
  desc: "村はひとりでに建ちません。今日中に、村のプロジェクトのどれかにゴールドか素材を寄付しましょう。"

# Group chains
c_bandits_1:
  name: 街道の山賊
  desc: "山賊が古都ケイルの廃墟で旅人を襲っています。2人以上のパーティで、山賊を8体倒しましょう。"
c_bandits_2:
  name: 山賊の頭目
  desc: "一味にはボスを失ってもらう必要があります。3人以上のパーティで、広場の東の隠れ家にいる山賊の頭目を倒しましょう。"
c_hag_1:
  name: 隠者の買い物リスト
  desc: "Morwenは妹と渡り合う前に物資が必要です。錬金術師、料理人、鍛冶屋が作った回復ポーション2個、具だくさんシチュー2個、バックル2個を届けましょう。"
c_hag_2:
  name: 妹の厄介事
  desc: "Morwenの意地悪な妹が、まだ小屋のそばに居座っています。2人以上のパーティで、沼の老魔女を倒しましょう。"
c_golems_1:
  name: 一座に飯を
  desc: "腹ぺこの鉱夫は掘りません。鍛冶屋と料理人が作った調理鍋1個と具だくさんシチュー3個を、親方Brakkaに届けましょう。"
c_golems_2:
  name: 立坑のゴーレム
  desc: "一座は腹いっぱいになったので、次は道を空けてやりましょう。2人以上のパーティで、鉱山の奥のロックゴーレムを5体倒しましょう。"
c_dungeon_1:
  name: 地下墓所の扉
  desc: "学者Inesは地下墓所を開けてほしがっています。3人以上のパーティで、太陽と月のレバーとルーンの封印を解きましょう。封印には魔法使い、その手前の罠には盗賊が必要です。"
c_dungeon_2:
  name: うつろの摂政
  desc: "うつろの摂政の長い治世に終止符を打ちましょう。3人以上のパーティで、地下墓所の最深部のボスを倒しましょう。"
c_civic_1:
  name: 地域の柱
  desc: "書記官Aldoはコイン1枚、板1枚まで数えています。村のプロジェクトに5回寄付しましょう。"
c_civic_2:
  name: 市民の義務
  desc: "民主主義は投票用紙と大きな声で動いています。村長選挙で投票し、掲示板にも書き込みましょう。"

# Escorts
e_mines_caravan:
  name: 鉱山への隊商
  desc: "商人Bramは鉱夫向けの品物と、ゼリーのように弱い神経を持っています。2人以上のパーティで、鉱山の入り口まで護衛しましょう。歩みは遅いです。"
e_ruins_caravan:
  name: 廃墟への隊商
  desc: "Bramは無法地帯の奥、廃墟の外れで商売をしたがっています。2人以上のパーティで、無傷のまま送り届けましょう。"

# Side quests
s_lost_locket:
  name: なくしたロケット
  desc: "Olgaがささやきの森でロケットをなくしました。狼が飲み込んだのではないかと疑っています。なくしたロケットを見つけて、届けてあげましょう。"
s_sealed_letter:
  name: 封をされた手紙
  desc: "Bertaは、暗泥の沼地の隠者Morwen宛ての封をされた手紙を預かっています。彼女の小屋まで運んで、話しかけましょう。読んではいけません。"
