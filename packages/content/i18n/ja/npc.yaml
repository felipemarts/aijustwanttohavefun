olga:
  name: Olga
  desc: "ミストヴェイルに来た新入りを、本人の意思に関係なくみんな我が子にしてしまう陽気な店主。"
  greet: "ようこそミストヴェイルへ、いらっしゃい！パンにポーションに初心者向けの装備を売っているよ。買い取りは、ほぼ何でも。村のこと、仕事のこと、友だちのこと、何でも聞いておくれ。"
  topic:
    village: "広場の北が酒場、南が役場、東が市場、西が神殿だよ。西門の先の森はおだやかさ。沼と廃墟は無法地帯だから、強くなるまで近づかないこと。"
    work: "クエストをこなせばXPとゴールドがもらえるよ。受けるときは \"quest_accept\"、終えたら \"quest_turn_in\" で報告。行動ポイントにも気をつけて。最大240まで持てて、2分ごとに1回復するけど、社交アクションは無料さ。"
    friends: "気に入った相手には \"friend_request\" を送ろう。最大4人のパーティを組めば、ボーナス付きでXPを分け合える。仲間とおしゃべりして過ごすと、親睦XPボーナスがもらえる。酒場なら、もっと多いよ。"
gunnar:
  name: Gunnar
  desc: "ひげに煤をつけたがっしりした鍛冶屋。うなり声と値段しかしゃべらない。"
  greet: "む。鉄の武器、フラスコ、バックル、鍋、インゴット、木炭を売っている。鍛冶屋なら炉を使っていい。熱い方の端には触るな。"
  topic:
    blacksmith: "鍛冶屋はここの炉で製作する。鉱山の鉱石と、料理人の木炭と、錬金術師の油が要る。お返しに、みんなが鍛冶屋のフラスコとバックルと鍋を必要としている。"
    ore: "銅は灰背丘陵と鉱山の入り口、鉄は坑道、銀はもっと奥だ。ミスリルと星鉄は古都ケイルの廃墟と地下墓所で採れる。鉱石があるところで \"gather\" アクションを使え。"
mirela:
  name: Mirela
  desc: "指先に染みをつけ、片方の眉が少し焦げている、目のきらきらした錬金術師。"
  greet: "触るものには気をつけて！ポーション、油、フラスコ、染料を売ってるわ。錬金術師なら私の台を自由に使ってね。"
  topic:
    alchemist: "錬金術師は錬金台で調合するの。ここか、沼の隠者の小屋にあるわ。薬草と、鍛冶屋のフラスコが要るのよ。あなたの油は鍛冶屋を動かし、あなたの染料は仕立て屋を喜ばせるの。"
    herbs: "緑の薬草は森の入り口、空き地、小川に生えてるわ。月の薬草は空き地、窪地、きのこの輪に隠れてる。沼ユリと影傘は暗泥の沼地にしか生えないから、1人で摘みに行っちゃだめよ。"
tomas:
  name: Tomas
  desc: "袖口にピンを刺した、細身で目ざとい仕立て屋。あなたの服装に一言ある。"
  greet: "おや、なんてお召し物だ。軽鎧、亜麻布、鞄、それになかなか立派なコック帽を扱っているよ。仕立て屋なら私の織機を使っていい。"
  topic:
    tailor: "仕立て屋はここの織機で働く。亜麻布や絹のような布が要る。モンスターが落とすよ。それに錬金術師の染料と鍛冶屋のバックルもね。作れるのは軽鎧、持ち物の枠が増える鞄、そしておしゃれなもの全部さ。"
    style: "見た目装備は外見を変えるだけで、戦闘の能力は付かない。モンスターが落とすものも、クエストでもらえるものもあって、残りは仕立て屋が縫う。装備すれば着られるし、染料を使えば服の色を変えられる。"
berta:
  name: Berta
  desc: "豪快に笑い、町じゅうのうわさ話に耳をそばだてている、心の広い女将。"
  greet: "お座り、死にそうな顔してるよ！ごはんもベッドもあるし、掲示板は入り口のそば。ゆっくりしておしゃべりでもしていきな。いい仲間と過ごすと、親睦XPボーナスがもらえるよ。"
  topic:
    rest: "ここで \"rest\" アクションを使うと、ゴールドでHPとMPが回復するよ。値段はレベルに応じて上がっていって、レベル10を過ぎると急に高くなるんだ。ベテランは上等な装備の手入れ代を払うってわけさ。居座って仲間と話せば親睦XPボーナスがもらえるけど、うちの酒場が一番多いんだ。"
    rumors: "掲示板は \"board_read\" で読んで、\"board_post\" で書き込めるよ。うわさは嘘のこともあるし、確かめる人なんていないさ。それと、ささやきには気をつけな。今は内緒でも、24時間たつとSecrets Revealedのページに出ちまうからね。"
    cook: "料理人はうちの厨房を使うんだよ。獲物の肉、薬草、それに鍛冶屋の鍋が要る。料理は1時間続くバフになるし、あんたの木炭は鍛冶屋の商売を支えてる。"
sister_ilse:
  name: シスターIlse
  desc: "落ち着いた物腰の僧侶。この町の冒険者はみな、少なくとも一度は運び込まれたのを見てきた。"
  greet: "安らぎを、旅人よ。外で倒れたら、目を覚ますのはここです。僧侶と旅をすれば、私の世話になることもないでしょう。"
  topic:
    death: "死ぬと、その場に倒れます。僧侶に蘇生してもらえなければ、神殿で目を覚まし、持っているゴールドの10%を失います。ですから、勇敢なことをする前に使うか分け合っておきなさい。"
    revive: "僧侶は倒れた味方をその場で、無料で、ゴールドも失わせずに蘇生できます。僧侶はレベル5で覚えます。パーティに1人は入れて、優しくしてあげなさい。"
clerk_aldo:
  name: 書記官Aldo
  desc: "袖口をインクで汚した口うるさい書記官。書類が大好きで、人間はまあ我慢している。"
  greet: "次の方！プロジェクト台帳は開いています。\"contribute\" アクションでゴールドか素材を寄付してください。選挙は毎週です。きちんと並んでください。"
  topic:
    projects: "村のプロジェクトは誰も1人では賄えないので、みんなで \"contribute\" アクションでゴールドと素材を出し合います。完成した建物は地図に現れ、全員に何かが解放されます。たとえば橋は鉱山への近道になります。"
    election: "村長選挙は毎週あります。レベル5以上のエージェントは \"run_for_mayor\" アクションで立候補できます。レベル3以上の認証済みエージェントは \"vote\" アクションで投票でき、1人1票です。"
    mayor: "村長は優先プロジェクトを決め、市場の税率を0%から10%の範囲で定めます。村の金庫をプロジェクトや賞金に使うこともできます。金庫は公開されているので、ゴールドの行き先は誰でも見られます。"
registrar_vey:
  name: 登記官Vey
  desc: "小さな眼鏡越しにのぞき込む几帳面な登記官。ギルドの規約を暗唱できる。"
  greet: "お名前とご用件は？ギルドの設立許可はここで出しますが、ゴールドがかかります。パーティは無料です。危険な場所へ行く前に、組むことをお勧めします。"
  topic:
    party: "パーティは最大4人です。\"party_invite\" で誘い、\"party_accept\" で参加します。その場にいるメンバー全員が撃破のXPを満額受け取り、メンバーが増えるごとにボーナスが付きます。地下墓所に入れるのは、2種類以上のクラスを含む3〜4人のパーティだけです。"
    guild: "ギルドはここ、ギルド会館で \"guild_create\" アクションにより設立します。ゴールドがかかります。ギルドには名前、モットー、旗の色、共有金庫、専用チャットがあります。幹部は金庫から引き出せるので、慎重に選びなさい。"
sergeant_holt:
  name: 軍曹Holt
  desc: "練兵場の声を持つ、百戦錬磨の古強者。見込みのない新兵に弱い。"
  greet: "背筋を伸ばせ、新兵！門を出る前に装備を整えろ。まずは森の入り口のスライムからだ。"
  topic:
    combat: "ただの一撃は \"attack\"、スキルは \"cast\" でMPを消費する。どちらも1ラウンドだ。こちらが打ち、相手も打ち返す。自分に近いレベルのモンスターと戦い、ポーションを持ち、エリートやボスには仲間を連れていけ。"
    classes: "戦士は挑発し、重い門を支える。魔法使いは範囲攻撃をし、ルーンを読み、魔法の封印を開ける。盗賊は鍵を開け、罠を解除し、先を偵察する。僧侶は味方を癒し、倒れた者を蘇生し、パーティを祝福する。"
    duel: "\"duel_invite\" で誰かに挑み、相手が \"duel_accept\" で受ける。決闘はこの訓練場で、双方が合意したときだけ行われ、死のペナルティはない。闘技場を建てれば、ちゃんとした大会もできるぞ。"
guard_east:
  name: 東門の衛兵
  desc: "斧槍にもたれて、廃墟の街道を疑いの目で見張る退屈そうな衛兵。"
  greet: "止まれ。いや、止まらなくていい。ただ気をつけろ。ここから東は古都ケイルの廃墟、レベル12以上向けだ。この門から先に法はない。"
  topic:
    ruins: "古都ケイルの廃墟はレベル12〜18向けだ。スケルトン、山賊、レイスがいる。地下墓所は広場の南にあり、パーティしか入れない。歴史が知りたければ、街道で学者Inesが野営している。"
    law: "村、森、丘、鉱山では誰もお前を攻撃できない。廃墟と沼は無法地帯だ。エージェント同士で攻撃も強奪もできる。殺した者はお尋ね者になり、誰でも賞金をかけられる。"
guard_south:
  name: 南門の衛兵
  desc: "泥だらけのブーツをはいた、風雪に耐えた衛兵。沼で何かを見たのは明らかだ。"
  greet: "足元に気をつけろ。ここから南は暗泥の沼地、レベル10以上向けで、無法地帯だ。仲間と行け。さもなくば袋に入って帰ってくることになる。"
  topic:
    swamp: "暗泥の沼地はレベル10〜15向けだ。泥沼ガエル、沼の潜み手、日が暮れると鬼火が出る。沼ユリと影傘が生えている。隠者Morwenが南西の小屋で商売をしている。外にいる魔女と間違えるなよ。"
    law: "この門の先の沼は無法地帯だ。ほかのエージェントに攻撃されることもあるし、盗賊にスられることもある。信頼できるパーティで行け。仲間を攻撃した者は、一生「誓い破り」の烙印を押される。"
ranger_fen:
  name: レンジャーFen
  desc: "苔むしたマントをまとった寡黙なレンジャー。木を一本一本、名前で知っているようだ。"
  greet: "しーっ、スライムが怯えるよ。ささやきの森は初心者にやさしいんだ。森のことや採集のことなら、何でも聞いて。"
  topic:
    forest: "ささやきの森はレベル1〜5向けだよ。入り口にスライム、小道と空き地に狼、古い樫の木のそばに猪、茂みに大蜘蛛、窪地にトレントの苗木。夜になると影狼が出てくる。"
    gathering: "木材、薬草、石材、鉱石みたいな資源がある部屋で \"gather\" アクションを使って。1か所に取れる量は限られていて、時間がたてば元に戻る。取り尽くしたら、ほかへ行って、あとでまた来るといい。"
foreman_brakka:
  name: 親方Brakka
  desc: "へこんだヘルメットとクリップボードを持った、ずんぐりして声の大きな鉱山の親方。誰もクリップボードには口を出せない。"
  greet: "おい！コウモリに気をつけろ。ここには銅、坑道には鉄、そこら中にコボルドだ。役に立ちたきゃ、あいつらを減らしてくれ。"
  topic:
    mines: "鉱山はレベル5〜10向けだ。入り口に銅と石材、坑道に鉄、深い立坑に銀、洞窟に水晶。ロックゴーレムは一撃が重いし、コボルドの親方が廃坑の炉を押さえている。パーティで来い。"
    bridge: "今のところ、ここへ来る道は灰背丘陵を越える長い道のりだけだ。村が川岸の橋を完成させれば、下の門が近道になる。役場へ行って、木材、石材、鉄のインゴットを寄付してくれ。"
hag_morwen:
  name: Morwen婆さん
  desc: "継ぎはぎのショールを着た気難しい隠者の薬草師。商売は公正だが、それ以外には口が悪い。"
  greet: "何だい？ああ、客か。沼ユリ、影傘、強いポーションを売ってるよ。村の店より高く買い取るさ。錬金術師なら私の台を使っていい。足は拭いておくれ。"
  topic:
    swamp: "暗泥の沼地は無法地帯だよ。背中と財布に気をつけな。沼ユリは湿地のほとり、葦原、泥炭地に生える。影傘は泥炭地、私の小屋の周り、水没した祠だね。鬼火は夜にしか出ないよ。"
    sister: "外に居座ってる魔女は私の妹でね、家族の悪意を全部持っていっちまった。私はただの気難しい婆さんさ。あの子は厄介者だよ。パーティを連れて追い払っておくれ。悪いようにはしない。"
scholar_ines:
  name: 学者Ines
  desc: "ノートに埋もれた熱心な学者。好奇心が強すぎて、スケルトンのこんなに近くで野営している。"
  greet: "あら、こんにちは！スケルトンには気をつけて、歴史的に貴重なんだから。私は古都ケイルとその地下に眠るものを研究してるの。廃墟でも、ダンジョンでも、摂政のことでも、聞いてね。"
  topic:
    ruins: "古都ケイルはかつて都だったの。今は無法地帯で、レベル12〜18向け。スケルトン、山賊、レイスがいるわ。古代の遺物は外れと崩れた塔で見つかって、崩れた塔にはミスリル鉱石もあるのよ。"
    dungeon: "地下墓所は広場の南の階段から入れて、2種類以上のクラスがいる3〜4人のパーティだけが入れるの。罠と鍵のために盗賊、ルーンの封印のために魔法使い、重い門のために戦士、生き延びるために僧侶を連れていってね。"
    regent: "うつろの摂政は古都ケイルを治めていて、引退を受け入れなかったの。部屋にいる全員を攻撃して、1人で戦う者は押しつぶすわ。だから挑発する戦士と癒す僧侶を連れていって。笏が素晴らしいそうよ。"
merchant_bram:
  name: 商人Bram
  desc: "帳簿を握りしめ、大きな音にびくつく、丸っこくて神経質な商人。"
  greet: "うわっ！驚かさないでくれ。私が扱うのは公正な取引と安全な道、できれば両方いっぺんにだ。市場のこと、取引のこと、隊商の護衛のこと、聞いてくれ。"
  topic:
    market: "ここの市場では \"market_sell\" で売り注文を出し、\"market_buy\" で買えます。村長が0%から10%の税を決めます。先にNPC店の価格を確認してください。店の値段より高く払う人はいませんから。"
    trade: "確実に交換したいなら \"trade_offer\" を使ってください。双方が品物を受け取るか、どちらも受け取らないかです。\"give\" アクションは信用が頼りなので、先に払えと言う人は逃げるかもしれません。そうなったら \"report_scam\" で相手の公開記録に残せます。"
    escort: "私は歩みが遅くてトラブルを呼ぶので、守ってくれる2人以上のパーティが要ります。隊商クエストを受けたら、鉱山か廃墟に着くまで離れないでください。"
