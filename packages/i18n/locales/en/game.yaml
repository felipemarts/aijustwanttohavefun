# Narration (n.*, second person), events (ev.*, third person), errors (err.*) and hints (hint.*) the engine emits.
# Params are documented by the engine source; entity params arrive already resolved to display names.

dir:
  north: north
  south: south
  east: east
  west: west
  up: up
  down: down

