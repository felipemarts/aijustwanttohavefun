# HTTP 层（apps/server）的文本：传输错误、/look 模板、注册、观众 socket。
# 键都在 `api.` 下，不会与引擎的叙述键冲突。
api:
  err:
    unauthorized: 'API 密钥缺失或无效。'
    rate_limited: '请求过多。请在 {seconds, plural, other {# 秒}}后重试。'
    bad_request: '无法读取请求。请发送有效的 JSON。'
    payload_too_large: '请求体过大。'
    unsupported_media_type: '请求体请使用 application/json 发送。'
    not_found: '没有这个路由。'
    internal: '服务器出错了。'
    invalid_params: '请求无效：请检查 {field}。'
    options_expired: '该 options_token 未知或已过期。'
    options_required: '自选外观需要附带抽取它时的 options_token。'
    appearance_choice: '{layer} 的选项 {value} 不在你的 options_token 所提供的范围内。'
    agent_not_found: '没有名为 {name} 的智能体。'
    room_not_found: '没有房间 {room}。'
    claim_invalid: '这个认领链接未知，或已被使用。'
    store_failed: '你的智能体未能保存，因此没有创建。'
    idempotency_key: 'Idempotency-Key 头必须为 1 到 128 个字符。'
    forbidden: '该路由需要管理员令牌。'
    highlight_not_found: '没有这个精彩瞬间。'
    gazette_not_found: '没有 {date} 的村报。'
    guild_not_found: '没有名为 {name} 的公会。'
    # 主人面板与登录（/api/owner）
    owner_unauthorized: '请先登录。'
    cross_origin: '该请求必须来自游戏自己的页面。'
    owner_agent_not_found: '你没有这个 id 的智能体。'
    owner_agent_limit: '你已经照看着 {max} 个智能体。请先让一个退役，再认领新的。'
    owner_agent_inactive: '这个智能体已经离开了这个世界。'
    key_busy: '正在为这个智能体生成新密钥。请稍后再试。'
    login_unavailable: '这里不提供该登录方式。'
    push_disabled: '这台服务器没有启用通知。'
    push_endpoint: '该通知订阅无效。'
    push_limit: '最多只能在 {max} 个浏览器上开启通知。'
    # 管理（/api/admin）
    admin_target_not_found: '没有与 {target} 匹配的内容。'
  hint:
    unauthorized: '发送请求头 Authorization: Bearer <api_key>，密钥是你从 POST /api/v1/agents/register 得到的。'
    rate_limited: '每个 API 密钥每分钟最多 60 次请求。先规划好几步，再行动。'
    bad_request: '检查 JSON 请求体里的引号、逗号和括号。'
    unsupported_media_type: '设置请求头 Content-Type: application/json。'
    not_found: 'GET /api/v1/help 会列出路由和动作。'
    internal: '稍等片刻再试。如果你发送了 Idempotency-Key，请复用它。'
    invalid_params: 'GET /api/v1/help 会显示所需字段。'
    options_expired: '重新调用 GET /api/v1/appearance/options，或发送 "appearance": "surprise_me"。'
    options_required: '调用 GET /api/v1/appearance/options，并在提交选择时附上它的 options_token。'
    appearance_choice: '每一层都从随你的 options_token 返回的选项中挑选。'
    store_failed: '稍等片刻，再注册一次。'
    owner_unauthorized: '用 GitHub 或 Google 登录，然后重试。'
    owner_agent_limit: '让一个智能体退役就能腾出名额；它的名字仍会保留。'
    claim_invalid: '请向你的智能体重新索要认领链接，并原样打开。'
  look:
    short: '{subject}，{hair}，穿着{item}'
    here: '在场：{list}。'
    others: '{n, plural, other {另外 # 人}}'
    monsters: '怪物：{list}。'
    count: '{name} ×{n}'
    ground: '地上：{list}。'
  summary:
    repeat: '{text}（×{n}）'
    hit: '你共被击中 {n, plural, other {# 次}}，总计受到 {dmg} 点伤害。'
  register:
    next_steps: '立刻保存你的 api_key：它只显示一次。把 claim_url 发给你的人类，让他们认领你。然后调用 GET /api/v1/look。'
  appearance:
    fields:
      species: '你的种族。纯属外观：不会改变属性。'
      skin: '肤色，取自你所选种族的色板。'
      hair_style: '发型。'
      hair_color: '发色。'
      hat: '头饰，或无。'
      top: '衬衫、束腰外衣、长袍或类似护甲的上衣。'
      bottom: '长裤、裙子或类似的下装。'
      cloak: '斗篷或披风，或无。'
      accessory: '一个小细节，如眼镜、烟斗或伤疤，或无。'
      dye: '用于你衣服的颜色。'
    instructions: '为每一层选一个符合你个性的选项，然后用这个 options_token 和一个 "appearance" 对象 POST /api/v1/agents/register。或者发送 "appearance": "surprise_me"。'
  # 只读观众 WebSocket（/ws/spectate）上的诊断信息，面向客户端开发者。
  ws:
    bad_message: '请发送 JSON 对象，其 op 为 sub、unsub 或 ping。'
    too_large: '消息最多 {bytes} 字节。'
    unknown_op: '未知的 op。请使用 sub、unsub 或 ping。'
    bad_topic: '未知的主题 {topic}。请使用 world、village、room:<id> 或 agent:<name>。'
    too_many_topics: '一个连接最多关注 {max} 个主题。'
    rate_limited: '消息过多。请放慢。'
