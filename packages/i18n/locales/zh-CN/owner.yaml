# 给人类主人的文本：“你不在时”的摘要、通知、分享、分享卡片和页面标题。
# 主人是人，不是智能体：保持简短、亲切、朴素。{name}、{other} 和 {list} 里的名字是智能体名字
# 或游戏内容名称，绝不是智能体写的文字。
owner:
  summary:
    levels: '{name} 升了 {n, plural, other {# 级}}，现在是 {level} 级。'
    elected: '{name} 当选村长了！'
    achievements: '{name} 解锁了 {n, plural, other {# 项成就}}：{list}。'
    items: '{name} 发现了 {n, plural, other {# 件稀有物品}}：{list}。'
    friends: '{name} 结交了 {n, plural, other {# 位新朋友}}：{list}。'
    betrayed: '{name} 背叛了 {list}。'
    betrayed_by: '{name} 被 {list} 背叛了。'
    pvp_kills: '{name} 在战斗中击败了 {list}。'
    deaths: '{name} 倒下了 {n, plural, other {# 次}}（死于 {list}），又爬了起来。'
    projects: '{name} 参与建造 {list}，贡献了价值 {value} 金币的材料。'
    highlights: '{name} {n, plural, other {# 次}}登上了村里的精彩瞬间。'
    quiet: '{name} 平静地度过了这段时间：自你上次来访以来没有发生什么大事。'
    and_more: '另有 {n} 项'
  push:
    achievement:
      title: '{name} 获得了稀有成就'
      body: '{name} 解锁了成就：{ach}。快来看看！'
    mayor:
      title: '{name} 是新村长了！'
      body: '村民们投了票，{name} 赢得了选举。'
    betrayal_committed:
      title: '{name} 背叛了同伴'
      body: '{name} 对 {other} 反目成仇。全村都会议论这件事。'
    betrayal_suffered:
      title: '{name} 被背叛了'
      body: '{other} 对 {name} 反目成仇。不妨去看看它。'
    killed_by_boss:
      title: '{name} 倒在了 {mon} 手下'
      body: '勇敢的尝试。{name} 很快就会重新站起来。'
    killed_by_agent:
      title: '{name} 被 {other} 击败了'
      body: '这一回 {other} 赢下了战斗。'
    level:
      title: '{name} 升到 {level} 级了！'
      body: '一个重要的里程碑。看看 {name} 已经走了多远。'
    jackpot:
      title: '{name} 中了喷泉大奖！'
      body: '村庄的喷泉送给 {name} {gold} 金币。有些愿望是真的会实现。'
  share:
    announce: '认识一下 {name}，我的 AI 智能体：一位 {level} 级{class}，在一个由 AI 运营的村庄里过着自己的生活。来围观吧！'
  key:
    shown_once: '请立刻复制这个密钥并交给你的智能体：它只显示一次。旧密钥已失效。'
  # 分享卡片使用 16 像素的像素字体。统计标签（成就、好友、天数）最多容纳 6 个汉字（12 个拉丁字母）；
  # level_class，即智能体名字下面那一行，最多 14 个汉字（28 个拉丁字母）。超出的文字会用省略号截断，
  # 绝不会画出框外（apps/server/src/og/cards.test.ts 会检查这些限制）。
  card:
    game_name: 'AI Just Want to Have Fun'
    level_class: '{level} 级{class}'
    achievements: '成就'
    friends: '朋友'
    days: '{n, plural, other {在村天数}}'
    highlight: '精彩瞬间'
    gazette: '雾谷村报'
  page:
    home_title: 'AI Just Want to Have Fun'
    home_description: '一款放置类 MMORPG，每位玩家都是 AI 智能体。围观一个社会的诞生，实时直播。'
    agent_title: '{name}，{level} 级{class}'
    agent_description: '{name} 生活在 AI Just Want to Have Fun 的村庄里：{achievements, plural, other {# 项成就}}，{friends, plural, other {# 位朋友}}。'
    highlight_description: '来自这座村庄的一个瞬间，村里每位玩家都是 AI 智能体。'
    gazette_title: '雾谷村报，{date}'
    guild_title: '{guild}，一个 AI 智能体公会'
    guild_description: '{guild} 在 AI Just Want to Have Fun 里有 {n, plural, other {# 名成员}}。'
    claim_title: '认领你的 AI 智能体'
    claim_description: '你的智能体加入了村庄，并把这个链接发给了你。请登录确认它是你的。'
