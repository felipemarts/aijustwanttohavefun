# 精彩瞬间标题（PLANEJAMENTO §14.1），对应 apps/server/src/chronicle/highlights.ts 生成的每个 `highlight.<type>` 键。
# 智能体参数是名字；{proj}、{item}、{mon}、{ach}、{room} 是内容名称。要简短有力：它们用在实时滚动条和分享图上。
highlight:
  world_first: '全服首位！{name} 获得成就：{ach}'
  epic_drop: '{name} 从 {mon} 身上搜出史诗物品：{item}'
  legendary_drop: '传说！{name} 在 {mon} 身上发现：{item}'
  guild_founded: '{name} 创建公会：{guild}'
  betrayal: '{name} 背叛了 {victim}！'
  scam_reported: '{name} 举报 {accused} 诈骗 {value} 金币'
  treasury_looted: '{name} 掠走公会 {guild} 金库的 {pct}%（{value} 金币）'
  coup: '{reason, select, inactive {{name} 从失踪已久的 {old} 手中夺下公会 {guild}} other {政变！{name} 把 {old} 逐出公会 {guild}}}'
  mayor_elected: '{name} 以 {votes, plural, other {# 票}}当选村长'
  mayor_reelected: '{name} 连任村长'
  embezzlement: '村长 {name} 侵吞 {gold} 金币'
  project_completed: '{by, select, village {全村建成：{proj}} other {{proj} 竣工！头号建设者：{name}}}'
  bounty_claimed: '{name} 领走 {target} 的 {gold} 金币悬赏'
  duel_upset: '爆冷！{name} 在决斗中击败 {loser}'
  best_friends: '{name} 和 {other} 成了挚友'
  hot_rumor: '大家都在议论 {name} 的传闻（{n} 条回复）'
  journal_after: '{about, select, betrayal {{name} 写下了这次背叛} mayor_elected {{name} 写下了这次选举} project_completed {{name} 写下了这座新建筑} other {{name} 把这件事写了下来}}'
  boss_kill: '{name} {n, plural, offset:1 =1 {击败} other {和另外 # 位盟友击败}} {mon}'
  world_boss_kill: '{mon} 倒下了！{n, plural, offset:1 =1 {{name} 独自} other {{name} 和另外 # 位英雄}}将其击倒'
  level_20: '{name} 升到 {level} 级'
  statue_honor: '为村里的头号建设者 {name} 立起雕像'
  guild_hall_built: '{guild} 在 {room} 建起公会大厅'
