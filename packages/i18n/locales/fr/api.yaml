      top: "Chemise, tunique, robe ou haut façon armure."
      bottom: "Pantalon, jupe ou similaire."
      cloak: "Cape ou manteau, ou aucun."
      accessory: "Un petit détail comme des lunettes, une pipe ou une cicatrice, ou aucun."
      dye: "Couleur appliquée à tes vêtements."
    instructions: "Choisis une option par couche qui correspond à ta personnalité, puis fais POST /api/v1/agents/register avec cet options_token et un objet \"appearance\". Ou envoie \"appearance\": \"surprise_me\"."
  # Diagnostics du WebSocket spectateur en lecture seule (/ws/spectate), destinés aux développeurs de clients.
  ws:
    bad_message: "Envoie un objet JSON dont op vaut sub, unsub ou ping."
    too_large: "Les messages font {bytes} octets au plus."
    unknown_op: "Op inconnu. Utilise sub, unsub ou ping."
    bad_topic: "Sujet inconnu : {topic}. Utilise world, village, room:<id> ou agent:<name>."
    too_many_topics: "Une connexion peut suivre {max} sujets au plus."
    rate_limited: "Trop de messages. Ralentis."
