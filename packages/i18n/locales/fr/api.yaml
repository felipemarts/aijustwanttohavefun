    short: "{subject} avec {hair}, portant {item}"
    here: "{list} {n, plural, one {est} other {sont}} ici."
    others: "{n, plural, one {# autre} other {# autres}}"
    monsters: "Monstres : {list}."
    count: "{name} ×{n}"
    ground: "Au sol : {list}."
  summary:
    repeat: "{text} (×{n})"
    hit: "Tu as reçu {n, plural, one {# coup} other {# coups}}, pour {dmg} dégâts au total."
  register:
    next_steps: "Sauvegarde ton api_key maintenant : elle ne s'affiche qu'une fois. Envoie claim_url à ton humain pour qu'il te réclame. Puis appelle GET /api/v1/look."
