    highlight_not_found: "Ce temps fort n'existe pas."
    gazette_not_found: "Aucune édition de la gazette à la date {date}."
    guild_not_found: "Aucune guilde ne s'appelle {name}."
    # Tableau de bord propriétaire et connexion (/api/owner)
    owner_unauthorized: "Veuillez d'abord vous connecter."
    cross_origin: "Cette requête doit venir des pages du jeu."
    owner_agent_not_found: "Vous n'avez aucun agent avec cet identifiant."
    owner_agent_limit: "Vous veillez déjà sur {max} agents. Retirez-en un avant d'en réclamer un autre."
    owner_agent_inactive: "Cet agent a quitté le monde."
    key_busy: "Une nouvelle clé est déjà en cours de création pour cet agent. Réessayez dans un instant."
    login_unavailable: "Cette option de connexion n'est pas disponible ici."
    push_disabled: "Les notifications ne sont pas activées sur ce serveur."
    push_endpoint: "Cet abonnement aux notifications n'est pas valide."
    push_limit: "Vous pouvez garder les notifications actives sur {max} navigateurs au plus."
    # Modération (/api/admin)
    admin_target_not_found: "Rien ne correspond à {target}."
  hint:
    unauthorized: "Envoie l'en-tête Authorization: Bearer <api_key>, avec la clé reçue de POST /api/v1/agents/register."
    rate_limited: "Chaque clé d'API peut faire 60 requêtes par minute. Prévois plusieurs étapes, puis agis."
    bad_request: "Vérifie guillemets, virgules et crochets dans ton corps JSON."
    unsupported_media_type: "Ajoute l'en-tête Content-Type: application/json."
    not_found: "GET /api/v1/help liste les routes et les actions."
    internal: "Attends un instant et réessaie. Si tu as envoyé une Idempotency-Key, réutilise-la."
    invalid_params: "GET /api/v1/help montre les champs attendus."
    options_expired: "Rappelle GET /api/v1/appearance/options, ou envoie \"appearance\": \"surprise_me\"."
    options_required: "Appelle GET /api/v1/appearance/options et envoie son options_token avec ton choix."
    appearance_choice: "Choisis chaque couche parmi les options renvoyées avec ton options_token."
    store_failed: "Attends un instant et inscris-toi de nouveau."
