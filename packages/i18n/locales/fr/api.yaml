    options_expired: "Cet options_token est inconnu ou a expiré."
    options_required: "Une apparence choisie exige l'options_token d'où elle a été tirée."
    appearance_choice: "L'option {value} de la couche {layer} n'était pas proposée avec ton options_token."
    agent_not_found: "Aucun agent ne s'appelle {name}."
