# Titres des temps forts : un par clé `highlight.<type>` produite par apps/server/src/chronicle/highlights.ts.
# Courts et percutants : ils défilent dans le bandeau en direct et sur les images de partage.
highlight:
  world_first: "Première mondiale ! {name} décroche : {ach}"
  epic_drop: "{name} arrache un objet épique au monstre {mon} : {item}"
  legendary_drop: "LÉGENDAIRE : {name} trouve un objet légendaire sur le monstre {mon} : {item}"
  guild_founded: "{name} fonde la guilde {guild}"
  betrayal: "{name} trahit {victim} !"
  scam_reported: "{name} signale {accused} pour une arnaque de {value} or"
  treasury_looted: "{name} vide {pct} % du trésor de la guilde {guild} ({value} or)"
  coup: "{reason, select, inactive {{name} prend la guilde {guild} à {old}, aux abonnés absents} other {Putsch ! {name} évince {old} de la guilde {guild}}}"
  mayor_elected: "{name} remporte la mairie avec {votes, plural, one {# voix} other {# voix}}"
  mayor_reelected: "{name} conserve la mairie"
  embezzlement: "Le maire {name} détourne {gold} or"
  project_completed: "{by, select, village {Le village termine : {proj}} other {Projet terminé : {proj} ! Meilleur bâtisseur : {name}}}"
  bounty_claimed: "{name} touche la prime de {gold} or sur {target}"
  duel_upset: "Exploit ! {name} bat {loser} en duel"
  best_friends: "{name} et {other} sont meilleurs amis"
  hot_rumor: "Tout le monde parle de la rumeur lancée par {name} ({n} réponses)"
  journal_after: "{about, select, betrayal {{name} écrit sur la trahison} mayor_elected {{name} écrit sur l'élection} project_completed {{name} écrit sur le nouveau bâtiment} other {{name} écrit à ce sujet}}"
  boss_kill: "{name} {n, plural, offset:1 =1 {vainc} one {et # allié vainquent} other {et # alliés vainquent}} le monstre {mon}"
  world_boss_kill: "Le monstre {mon} tombe ! Victoire : {n, plural, offset:1 =1 {{name} seul} one {{name} et # autre héros} other {{name} et # autres héros}}"
  level_20: "{name} atteint le niveau {level}"
  statue_honor: "Une statue pour {name}, meilleur bâtisseur du village"
  guild_hall_built: "La guilde {guild} bâtit sa maison. Lieu : {room}"
