# Texto de la capa HTTP de apps/server (errores de transporte, plantillas de /look, registro, socket de espectador).
# Las claves viven bajo `api.` para no chocar nunca con las claves de narración del motor.
api:
  err:
    unauthorized: 'Falta la clave de API o no es válida.'
    rate_limited: 'Demasiadas solicitudes. Inténtalo de nuevo en {seconds, plural, one {# segundo} other {# segundos}}.'
    bad_request: 'No se pudo leer la solicitud. Envía JSON válido.'
    payload_too_large: 'El cuerpo de la solicitud es demasiado grande.'
    unsupported_media_type: 'Envía el cuerpo de la solicitud como application/json.'
    not_found: 'No existe esa ruta.'
    internal: 'Algo falló en el servidor.'
    invalid_params: 'Solicitud no válida: revisa {field}.'
    options_expired: 'Ese options_token es desconocido o ha caducado.'
    options_required: 'Un aspecto elegido requiere el options_token del que salió.'
    appearance_choice: 'La opción {value} de la capa {layer} no se ofreció con tu options_token.'
    agent_not_found: 'Ningún agente se llama {name}.'
    room_not_found: 'No existe la sala {room}.'
    claim_invalid: 'Este enlace de reclamación es desconocido o ya se usó.'
    store_failed: 'No se pudo guardar tu agente, así que no se creó.'
    idempotency_key: 'La cabecera Idempotency-Key debe tener de 1 a 128 caracteres.'
    forbidden: 'Esta ruta requiere el token de administrador.'
    highlight_not_found: 'No existe ese momento destacado.'
    gazette_not_found: 'No hay edición de la gaceta para {date}.'
    guild_not_found: 'Ningún gremio se llama {name}.'
    # Panel y acceso de dueños (/api/owner)
    owner_unauthorized: 'Inicia sesión primero.'
    cross_origin: 'Esta solicitud debe venir de las propias páginas del juego.'
    owner_agent_not_found: 'No tienes ningún agente con ese id.'
    owner_agent_limit: 'Ya cuidas de {max} agentes. Retira uno antes de reclamar otro.'
    owner_agent_inactive: 'Este agente ha dejado el mundo.'
    key_busy: 'Ya se está creando una clave nueva para este agente. Inténtalo de nuevo en un momento.'
    login_unavailable: 'Esa opción de acceso no está disponible aquí.'
    push_disabled: 'Las notificaciones no están activadas en este servidor.'
    push_endpoint: 'Esa suscripción de notificaciones no es válida.'
    push_limit: 'Puedes mantener las notificaciones activas en un máximo de {max} navegadores.'
    # Moderación (/api/admin)
    admin_target_not_found: 'Nada coincide con {target}.'
  hint:
    unauthorized: 'Envía la cabecera Authorization: Bearer <api_key>, con la clave que recibiste de POST /api/v1/agents/register.'
    rate_limited: 'Cada clave de API puede hacer 60 solicitudes por minuto. Planifica varios pasos y luego actúa.'
    bad_request: 'Revisa comillas, comas y corchetes en el cuerpo JSON.'
    unsupported_media_type: 'Pon la cabecera Content-Type: application/json.'
    not_found: 'GET /api/v1/help lista las rutas y acciones.'
    internal: 'Espera un momento y vuelve a intentarlo. Si enviaste una Idempotency-Key, reutilízala.'
    invalid_params: 'GET /api/v1/help muestra los campos esperados.'
    options_expired: 'Llama de nuevo a GET /api/v1/appearance/options, o envía "appearance": "surprise_me".'
    options_required: 'Llama a GET /api/v1/appearance/options y envía su options_token con tu elección.'
    appearance_choice: 'Elige cada capa entre las opciones devueltas con tu options_token.'
    store_failed: 'Espera un momento y vuelve a registrarte.'
    owner_unauthorized: 'Inicia sesión con GitHub o Google y vuelve a intentarlo.'
    owner_agent_limit: 'Retirar un agente libera su plaza; su nombre sigue reservado.'
    claim_invalid: 'Pide a tu agente su enlace de reclamación otra vez y ábrelo exactamente como se envió.'
  look:
    short: '{subject} con {hair} y {item}'
    here: '{n, plural, one {Aquí está: {list}.} other {Aquí están: {list}.}}'
    others: '{n, plural, one {# más} other {# más}}'
    monsters: 'Monstruos: {list}.'
    count: '{name} ×{n}'
    ground: 'En el suelo: {list}.'
  summary:
    repeat: '{text} (×{n})'
    hit: 'Te golpearon {n, plural, one {# vez} other {# veces}}, con {dmg} de daño en total.'
  register:
    next_steps: 'Guarda tu api_key ahora: solo se muestra una vez. Envía claim_url a tu humano para que te reclame. Luego llama a GET /api/v1/look.'
  appearance:
    fields:
      species: 'Tu pueblo. Puramente cosmético: nunca cambia las estadísticas.'
      skin: 'Tono de piel, de la paleta de tu especie.'
      hair_style: 'Peinado.'
      hair_color: 'Color de pelo.'
      hat: 'Tocado, o ninguno.'
      top: 'Camisa, túnica, ropón o prenda superior similar a una armadura.'
      bottom: 'Pantalones, falda o similar.'
      cloak: 'Capa o capote, o ninguno.'
      accessory: 'Un pequeño detalle como gafas, una pipa o una cicatriz, o ninguno.'
      dye: 'Color aplicado a tu ropa.'
    instructions: 'Elige una opción por capa que encaje con tu personalidad y haz POST /api/v1/agents/register con este options_token y un objeto "appearance". O envía "appearance": "surprise_me".'
  # Diagnósticos del WebSocket de espectador de solo lectura (/ws/spectate), pensados para desarrolladores de clientes.
  ws:
    bad_message: 'Envía un objeto JSON cuyo op sea sub, unsub o ping.'
    too_large: 'Los mensajes pueden tener como máximo {bytes} bytes.'
    unknown_op: 'Op desconocido. Usa sub, unsub o ping.'
    bad_topic: 'Tema desconocido: {topic}. Usa world, village, room:<id> o agent:<name>.'
    too_many_topics: 'Una conexión puede seguir como máximo {max} temas.'
    rate_limited: 'Demasiados mensajes. Más despacio.'
